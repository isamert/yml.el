name: Native modules

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            library: libyml.so
            suffix: so
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            library: libyml.so
            suffix: so
          - os: macos-15-intel
            target: x86_64-apple-darwin
            library: libyml.dylib
            suffix: so
          - os: macos-15
            target: aarch64-apple-darwin
            library: libyml.dylib
            suffix: so
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            library: yml.dll
            suffix: dll
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Check package and release versions
        shell: bash
        run: |
          set -euo pipefail
          cargo_version=$(awk '/^\[/ { package = ($0 == "[package]") } package && /^version[[:space:]]*=/ { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)
          elisp_version=$(sed -n 's/^;; Version: \([^[:space:]]*\)[[:space:]]*$/\1/p' yml.el)
          if [[ -z "$cargo_version" || "$cargo_version" != "$elisp_version" ]]; then
            echo 'Cargo.toml and yml.el versions must match' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$cargo_version" ]]; then
            echo "Release tag must be v$cargo_version, not $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.87.0 --profile minimal --target '${{ matrix.target }}'
          rustup default 1.87.0
      - name: Build native module
        run: cargo build --release --locked --lib --target ${{ matrix.target }}
      - name: Package module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp 'target/${{ matrix.target }}/release/${{ matrix.library }}' \
            'dist/yml-core-${{ matrix.target }}.${{ matrix.suffix }}'
      - name: Install Emacs (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
      - name: Install Emacs (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install emacs
          echo "$(brew --prefix emacs)/bin" >> "$GITHUB_PATH"
      - name: Install Emacs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install emacs --yes --no-progress
      - name: Test integration in Emacs
        shell: bash
        run: |
          emacs --version
          emacs --batch -Q -L . \
            --eval '(module-load (expand-file-name "dist/yml-core-${{ matrix.target }}.${{ matrix.suffix }}"))' \
            -l tests/yml-tests.el -f ert-run-tests-batch-and-exit
      - uses: actions/upload-artifact@v4
        with:
          name: module-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: module-*
          merge-multiple: true
          path: dist
      - name: Create checksum manifest and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd dist
          sha256sum yml-core-* > SHA256SUMS
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" yml-core-* SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
