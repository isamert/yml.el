[package]
name = "emacs-yml"
version = "0.2.0"
description = "Emacs dynamic module to parse yaml written in Rust"
authors = ["Isa Mert Gurbuz <isamertgurbuz@gmail.com>", "Ayush Goyal <ayush@helpshift.com>"]
edition = "2024"
rust-version = "1.87"
keywords = ["emacs", "emacs-module", "yaml", "yml", "parser"]
license = "GPL-3.0-or-later"

[lib]
name = "yml"
crate-type = ["cdylib"]

[dependencies]
emacs = "0.22.0"
yaml-rust2 = "0.10.0"
hashlink = "0.10"
