[package]
name = "yamlmod"
version = "0.2.0"
description = "Emacs dynamic module to parse yaml written in Rust"
authors = ["Ayush Goyal <ayush@helpshift.com>", "Isa Mert Gurbuz <isamertgurbuz@gmail.com>"]
edition = "2024"
rust-version = "1.85"
keywords = ["emacs", "emacs-module", "yaml", "parser"]
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
emacs = "0.19.0"
yaml-rust2 = "0.10.0"
